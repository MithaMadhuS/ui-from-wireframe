services:

  frontend:
    build:
      context: ./frontend/ui-generator-frontend
    container_name: wireframe-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: wireframe-backend
    # commenting below ports after reverse proxy setup
    # ports:
    #   - "4000:4000"
    environment:
      PORT: ${PORT}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # DB_HOST: postgres
      # DB_PORT: 5432
      # DB_NAME: wireframe
      # DB_USER: app
      # DB_PASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: [ "CMD","node","-e","require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: wireframe-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d wireframe"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data: